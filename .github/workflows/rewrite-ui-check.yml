name: Verify rewrite UI

on:
  push:
    branches:
      - rewrite-project
    paths-ignore:
      - package-lock.json
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rewrite-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and refresh lockfile
        run: npm install --no-audit --no-fund

      - name: Format rewrite sources
        run: npm run format

      - name: Lint source
        run: npm run lint

      - name: Type-check application
        run: npm run typecheck

      - name: Run UI tests
        run: npm run test:ui

      - name: Build application
        run: npm run build

      - name: Commit generated updates
        if: ${{ github.event_name == 'push' && github.actor != 'github-actions[bot]' }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package-lock.json \
            package.json \
            src/App.tsx \
            src/main.tsx \
            src/index.css \
            src/components/editor/simple-editor.tsx \
            src/components/workspace/workspace-sidebar.tsx \
            src/features/workspace/workspace-store.ts \
            tests/ui/editor-store.test.ts \
            .github/workflows/rewrite-ui-check.yml
          git commit -m "chore: normalize rewrite UI sources"
          git push
