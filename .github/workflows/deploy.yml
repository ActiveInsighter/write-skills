name: Build and deploy Write Skills
run-name: Deploy Write Skills · ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: write-skills-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: write-skills-db
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record Run ID at start
        id: run-start
        uses: ./.github/actions/record-run
        with:
          status: in_progress
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Create or resolve D1 database
        id: d1
        run: npm run cf:prepare

      - name: Type-check
        run: npm run typecheck

      - name: Build Worker and web app
        run: npm run build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote

      - name: Deploy to Cloudflare Workers
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          cat deploy.log >> "$GITHUB_STEP_SUMMARY"

      - name: Configure application password
        shell: bash
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${APP_PASSWORD:-}" ]]; then
            printf '%s' "$APP_PASSWORD" | npx wrangler secret put APP_PASSWORD
          else
            echo "APP_PASSWORD is not configured; the application will be open unless protected by Cloudflare Access."
          fi

      - name: Record final Run ID and status
        if: always()
        uses: ./.github/actions/record-run
        with:
          status: ${{ job.status }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload run history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-history-${{ github.run_id }}
          path: run-history
          retention-days: 90
          if-no-files-found: warn

      - name: Publish recent run history branch
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cp -R run-history /tmp/write-skills-run-history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan run-history-publish
          git rm -rf . >/dev/null 2>&1 || true
          cp -R /tmp/write-skills-run-history/. .
          git add recent-runs.json recent-runs.md
          git commit -m "chore: update recent workflow runs [skip ci]"
          git push --force origin HEAD:run-history
