name: Deploy Cloudflare
run-name: Deploy ${{ github.event_name == 'push' && 'production' || inputs.target }} · ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: GitHub Environment and Cloudflare target
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-deploy-${{ github.event_name == 'push' && 'production' || inputs.target }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run quality checks and tests
        run: npm run check

      - name: Build release candidate
        run: npm run build

      - name: Validate release bundle
        run: npx wrangler deploy --dry-run

  deploy:
    name: Migrate and deploy ${{ github.event_name == 'push' && 'production' || inputs.target }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ github.event_name == 'push' && 'production' || inputs.target }}
    env:
      CI: "true"
      DEPLOY_TARGET: ${{ github.event_name == 'push' && 'production' || inputs.target }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME || ((github.event_name == 'push' || inputs.target == 'production') && 'write-skills' || 'write-skills-staging') }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME || ((github.event_name == 'push' || inputs.target == 'production') && 'write-skills-db' || 'write-skills-staging-db') }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
      ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve or create D1 database
        if: ${{ env.CLOUDFLARE_D1_DATABASE_ID == '' }}
        shell: bash
        env:
          D1_DATABASE_NAME: ${{ env.CLOUDFLARE_D1_DATABASE_NAME }}
        run: |
          set -euo pipefail

          echo "::notice title=Resolving D1 database::CLOUDFLARE_D1_DATABASE_ID is empty; looking up or creating '${D1_DATABASE_NAME}'."
          npm run cf:prepare

          database_id="$(node --input-type=module <<'NODE'
          import fs from "node:fs"
          import { parse } from "jsonc-parser"

          const source = fs.readFileSync("wrangler.jsonc", "utf8")
          const config = parse(source)
          const database = config.d1_databases?.find((item) => item.binding === "DB")
          process.stdout.write(database?.database_id || "")
          NODE
          )"

          if [[ ! "$database_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error title=Unable to resolve D1 database::cf:prepare did not produce a valid D1 UUID."
            exit 1
          fi

          echo "CLOUDFLARE_D1_DATABASE_ID=$database_id" >> "$GITHUB_ENV"
          echo "- D1 ID: resolved automatically" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate resolved target configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_D1_DATABASE_ID \
            CLOUDFLARE_WORKER_NAME \
            CLOUDFLARE_D1_DATABASE_NAME
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing deployment configuration::$name could not be resolved for the '${DEPLOY_TARGET}' GitHub Environment."
              missing=1
            fi
          done

          if [[ -n "${ACCESS_PASSWORD:-}" && -z "${SESSION_SECRET:-}" ]]; then
            echo "::error title=Missing session secret::SESSION_SECRET is required whenever ACCESS_PASSWORD is configured."
            missing=1
          fi

          if (( missing != 0 )); then
            exit 1
          fi

      - name: Configure ephemeral Wrangler target
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from "node:fs"

          const configPath = "wrangler.jsonc"
          const workerName = process.env.CLOUDFLARE_WORKER_NAME
          const databaseName = process.env.CLOUDFLARE_D1_DATABASE_NAME
          const databaseId = process.env.CLOUDFLARE_D1_DATABASE_ID

          if (!/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(workerName)) {
            throw new Error("CLOUDFLARE_WORKER_NAME must contain lowercase letters, numbers, and hyphens only")
          }
          if (!/^[A-Za-z0-9_-]{1,64}$/.test(databaseName)) {
            throw new Error("CLOUDFLARE_D1_DATABASE_NAME contains unsupported characters")
          }
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(databaseId)) {
            throw new Error("CLOUDFLARE_D1_DATABASE_ID must be a D1 UUID")
          }

          let source = fs.readFileSync(configPath, "utf8")
          const replaceField = (field, value) => {
            const pattern = new RegExp(`("${field}"\\s*:\\s*)"[^"]*"`)
            if (!pattern.test(source)) {
              throw new Error(`wrangler.jsonc is missing ${field}`)
            }
            source = source.replace(
              pattern,
              (_, prefix) => `${prefix}${JSON.stringify(value)}`,
            )
          }

          replaceField("name", workerName)
          replaceField("database_name", databaseName)
          replaceField("database_id", databaseId)
          fs.writeFileSync(configPath, source)
          NODE

          {
            echo "## Deployment target"
            echo
            echo "- Environment: \`${DEPLOY_TARGET}\`"
            echo "- Worker: \`${CLOUDFLARE_WORKER_NAME}\`"
            echo "- D1: \`${CLOUDFLARE_D1_DATABASE_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build target bundle
        run: npm run build

      - name: Validate target bundle
        run: npx wrangler deploy --dry-run

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Synchronize optional access secrets atomically
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ACCESS_PASSWORD:-}" && -z "${SESSION_SECRET:-}" ]]; then
            echo "::notice title=Access password not changed::ACCESS_PASSWORD is empty. Existing APP_PASSWORD secrets are intentionally preserved; delete one explicitly in Cloudflare to disable the gate."
            echo "- Access password: not changed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          secrets_file="${RUNNER_TEMP}/write-skills-secrets.json"
          export SECRETS_FILE="$secrets_file"
          trap 'rm -f "$secrets_file"' EXIT

          node --input-type=module <<'NODE'
          import fs from "node:fs"

          const secrets = {}
          if (process.env.ACCESS_PASSWORD) {
            secrets.APP_PASSWORD = process.env.ACCESS_PASSWORD
          }
          if (process.env.SESSION_SECRET) {
            secrets.SESSION_SECRET = process.env.SESSION_SECRET
          }
          fs.writeFileSync(
            process.env.SECRETS_FILE,
            JSON.stringify(secrets),
            { mode: 0o600 },
          )
          NODE

          npx wrangler secret bulk "$secrets_file"
          echo "- Access secrets: synchronized in one Worker version" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy Worker and static assets
        run: npx wrangler deploy

      - name: Smoke-test deployment
        if: ${{ env.HEALTHCHECK_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          health_url="${HEALTHCHECK_URL%/}/api/health"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "$health_url"
          echo "- Health check: passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish deployment status
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          updated_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          status_icon="❌"
          if [[ "$DEPLOY_STATUS" == "success" ]]; then
            status_icon="✅"
          elif [[ "$DEPLOY_STATUS" == "cancelled" ]]; then
            status_icon="⏹️"
          fi

          status_file="${RUNNER_TEMP}/deployment-status.md"
          cat > "$status_file" <<EOF
          # Cloudflare deployment status

          ${status_icon} **${DEPLOY_STATUS}**

          | Item | Value |
          | --- | --- |
          | Environment | \`${DEPLOY_TARGET}\` |
          | Worker | \`${CLOUDFLARE_WORKER_NAME}\` |
          | D1 | \`${CLOUDFLARE_D1_DATABASE_NAME}\` |
          | Run ID | \`${GITHUB_RUN_ID}\` |
          | Commit | \`${GITHUB_SHA}\` |
          | Branch | \`${GITHUB_REF_NAME}\` |
          | Event | \`${GITHUB_EVENT_NAME}\` |
          | Updated | ${updated_at} |

          [Open workflow run](${RUN_URL})

          This issue is updated automatically after every Cloudflare deployment attempt.
          EOF

          issue_number="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search '"Cloudflare deployment status" in:title' \
              --json number,title \
              --jq '.[] | select(.title == "Cloudflare deployment status") | .number' \
              | head -n 1
          )"

          if [[ -z "$issue_number" ]]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Cloudflare deployment status" \
              --body-file "$status_file"
          else
            gh issue edit "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$status_file"
          fi
