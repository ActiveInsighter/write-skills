name: Pull request CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality, tests, and dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Repair stylesheet formatting on the PR branch
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write src/styles/workbench.css
          if ! git diff --quiet -- src/styles/workbench.css; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/styles/workbench.css
            git commit -m "style: format workbench stylesheet"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check generated Worker types
        run: npm run types:check

      - name: Type-check
        run: npm run typecheck

      - name: Run UI and Worker tests
        run: npm run test

      - name: Build SPA and Worker
        run: npm run build

      - name: Validate deployment bundle
        run: npx wrangler deploy --dry-run
