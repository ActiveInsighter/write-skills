name: Pull request CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality, tests, and dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate formatted stylesheet for repair
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write src/styles/workbench.css
          echo "::group::FORMATTED_WORKBENCH_CSS_BASE64"
          base64 -w0 src/styles/workbench.css
          echo
          echo "::endgroup::"

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check generated Worker types
        run: npm run types:check

      - name: Type-check
        run: npm run typecheck

      - name: Run UI and Worker tests
        run: npm run test

      - name: Build SPA and Worker
        run: npm run build

      - name: Validate deployment bundle
        run: npx wrangler deploy --dry-run
